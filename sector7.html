<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SECTOR 7 : COLONY DEFENSE</title>
  <style>
    :root {
      --bg: #050b16;
      --panel: rgba(7, 16, 28, 0.78);
      --cyan: #65d9ff;
      --blue: #3d8dff;
      --green: #7ef7b7;
      --orange: #ff9a3d;
      --pink: #ff5ea8;
      --red: #ff5b5b;
      --text: #eaf7ff;
      --muted: #9bc0d8;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      background:
        radial-gradient(circle at top, rgba(24, 44, 88, 0.7), transparent 30%),
        linear-gradient(180deg, #020710 0%, #070d18 100%);
      color: var(--text);
      font-family: "Segoe UI", "Consolas", monospace;
      overflow: hidden;
    }

    body {
      display: grid;
      place-items: center;
    }

    canvas {
      display: block;
      width: min(96vw, 1110px);
      height: min(90vh, 720px);
      border: 1px solid rgba(130, 196, 255, 0.3);
      box-shadow: 0 0 30px rgba(67, 146, 255, 0.25), inset 0 0 30px rgba(111, 196, 255, 0.08);
      background: #020914;
      image-rendering: auto;
    }

    #hud {
      position: fixed;
      top: 18px;
      left: 22px;
      right: 22px;
      display: flex;
      justify-content: space-between;
      gap: 18px;
      pointer-events: none;
      z-index: 10;
    }

    .panel {
      background: rgba(10, 20, 29, 0.6);
      border: 1px solid rgba(113, 173, 255, 0.25);
      border-radius: 12px;
      padding: 12px 16px;
      backdrop-filter: blur(6px);
      box-shadow: 0 0 20px rgba(93, 149, 255, 0.12);
    }

    .brand {
      letter-spacing: 0.18em;
      font-size: 12px;
      font-weight: 700;
      color: var(--cyan);
      text-transform: uppercase;
    }

    .stats {
      display: flex;
      align-items: center;
      gap: 18px;
      min-width: 320px;
      justify-content: flex-end;
      flex-wrap: wrap;
    }

    .metric {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 100px;
    }

    .label {
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .value {
      font-size: 17px;
      font-weight: 700;
      color: var(--text);
    }

    .bar {
      width: 150px;
      height: 10px;
      border-radius: 999px;
      background: rgba(196, 218, 246, 0.12);
      overflow: hidden;
      border: 1px solid rgba(164, 196, 255, 0.18);
    }

    .bar > span {
      display: block;
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #ff6d6d, #ffb84d, #74f7b4);
      box-shadow: 0 0 14px rgba(116, 247, 180, 0.7);
      transition: width 0.18s ease;
    }

    #overlay {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background: rgba(1, 4, 8, 0.48);
      z-index: 20;
      transition: opacity 0.2s ease;
    }

    #overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .menu {
      width: min(560px, 88vw);
      background: rgba(8, 14, 23, 0.84);
      border: 1px solid rgba(117, 175, 255, 0.38);
      border-radius: 18px;
      padding: 28px 26px 22px;
      text-align: center;
      box-shadow: 0 0 30px rgba(63, 142, 255, 0.18);
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(2rem, 4vw, 3rem);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--cyan);
      text-shadow: 0 0 20px rgba(101, 217, 255, 0.4);
    }

    .tagline {
      margin: 0 0 20px;
      color: var(--muted);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-size: 11px;
    }

    .controls {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      margin: 18px 0 8px;
      color: #cfe4ff;
      font-size: 13px;
    }

    .chip {
      background: rgba(111, 151, 255, 0.08);
      border: 1px solid rgba(137, 183, 255, 0.2);
      border-radius: 999px;
      padding: 8px 12px;
    }

    button {
      appearance: none;
      border: 0;
      border-radius: 12px;
      padding: 14px 24px;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #05141d;
      background: linear-gradient(135deg, #7ee7ff, #7ef7b7);
      cursor: pointer;
      box-shadow: 0 10px 20px rgba(126, 247, 183, 0.25);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 14px 25px rgba(126, 247, 183, 0.34);
    }

    @media (max-width: 700px) {
      #hud {
        top: 10px;
        left: 10px;
        right: 10px;
        flex-direction: column;
      }

      .stats {
        justify-content: flex-start;
      }
    }
  </style>
</head>
<body>
  <div id="hud">
    <div class="panel brand">SECTOR 7</div>
    <div class="panel stats">
      <div class="metric">
        <div class="label">Objective</div>
        <div class="value" id="objective">Earth</div>
      </div>
      <div class="metric">
        <div class="label">Score</div>
        <div class="value" id="score">0</div>
      </div>
      <div class="metric">
        <div class="label">Hull</div>
        <div class="bar"><span id="hpBar"></span></div>
      </div>
    </div>
  </div>

  <div id="overlay">
    <div class="menu">
      <h1>Colony Defense</h1>
      <p class="tagline">Destroy the Solar Empire. Survive.</p>
      <button id="startBtn">Start Mission</button>
      <div class="controls">
        <div class="chip">WASD / Arrows</div>
        <div class="chip">Space</div>
        <div class="chip">Esc</div>
      </div>
    </div>
  </div>

  <canvas id="gameCanvas" width="1100" height="720"></canvas>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const overlay = document.getElementById('overlay');
    const startBtn = document.getElementById('startBtn');
    const scoreEl = document.getElementById('score');
    const objectiveEl = document.getElementById('objective');
    const hpBar = document.getElementById('hpBar');

    const keys = {};
    const world = {
      width: canvas.width,
      height: canvas.height,
      leftBound: 80,
      rightBound: canvas.width - 60,
      active: false,
      win: false,
      level: 0,
      score: 0,
      kills: 0,
      goal: 6,
      enemySpawnTimer: 0,
      enemySpawnDelay: 1.2,
      player: null,
      bullets: [],
      enemies: [],
      particles: [],
      stars: []
    };

    const levelNames = ['Earth Skies', 'Venus Assault', 'Mercury Strike', 'Sun Titan'];
    const palette = [
      { skyTop: '#0c2e5b', skyBottom: '#65d9ff', accent: '#7fe3ff' },
      { skyTop: '#29081f', skyBottom: '#ff7b9d', accent: '#ffb06c' },
      { skyTop: '#070d1d', skyBottom: '#89a7ff', accent: '#c6d3ff' },
      { skyTop: '#1a0900', skyBottom: '#ff7d18', accent: '#ffd16a' }
    ];

    function rand(min, max) { return min + Math.random() * (max - min); }

    function createStars() {
      world.stars = [];
      for (let i = 0; i < 120; i++) {
        world.stars.push({
          x: rand(0, world.width),
          y: rand(0, world.height),
          r: rand(1, 3),
          speed: rand(0.5, 2.5),
          alpha: rand(0.2, 1)
        });
      }
    }

    function resetPlayer() {
      world.player = {
        x: 170,
        y: world.height / 2,
        w: 46,
        h: 18,
        speed: 360,
        health: 100,
        maxHealth: 100,
        fireCooldown: 0,
        hitFlash: 0
      };
    }

    function resetGame() {
      world.active = true;
      world.win = false;
      world.level = 0;
      world.score = 0;
      world.kills = 0;
      world.goal = 6;
      world.enemySpawnTimer = 0;
      world.enemySpawnDelay = 1.2;
      world.bullets = [];
      world.enemies = [];
      world.particles = [];
      createStars();
      resetPlayer();
      updateHud();
    }

    function startGame() {
      overlay.classList.add('hidden');
      resetGame();
    }

    function gameOver() {
      world.active = false;
      overlay.classList.remove('hidden');
      overlay.querySelector('h1').textContent = 'Mission Failed';
      overlay.querySelector('.tagline').textContent = 'The colony needs another pilot.';
      startBtn.textContent = 'Retry Mission';
    }

    function victory() {
      world.active = false;
      world.win = true;
      overlay.classList.remove('hidden');
      overlay.querySelector('h1').textContent = 'Victory';
      overlay.querySelector('.tagline').textContent = 'Solar Empire routed. Sector 7 survives.';
      startBtn.textContent = 'Fly Again';
    }

    function updateHud() {
      scoreEl.textContent = world.score;
      objectiveEl.textContent = levelNames[world.level] || 'Victory';
      const hpPct = Math.max(0, world.player ? (world.player.health / world.player.maxHealth) * 100 : 0);
      hpBar.style.width = hpPct + '%';
      hpBar.style.background = hpPct > 50 ? 'linear-gradient(90deg, #7ef7b7, #7ef7b7)' : hpPct > 25 ? 'linear-gradient(90deg, #ffb84d, #ffb84d)' : 'linear-gradient(90deg, #ff5b5b, #ff5b5b)';
    }

    function addParticles(x, y, color, count = 16) {
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = rand(30, 180);
        world.particles.push({
          x, y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          life: rand(0.3, 0.9),
          color,
          size: rand(2, 5)
        });
      }
    }

    function spawnEnemy() {
      const enemyType = world.level === 0 ? 1 : world.level === 1 ? 2 : world.level === 2 ? 3 : 4;
      const x = world.width + 30;
      const y = rand(70, world.height - 70);
      const enemy = {
        x, y, type: enemyType,
        w: enemyType === 1 ? 52 : enemyType === 2 ? 44 : enemyType === 3 ? 38 : 110,
        h: enemyType === 1 ? 26 : enemyType === 2 ? 28 : enemyType === 3 ? 24 : 92,
        health: enemyType === 4 ? 12 : enemyType === 3 ? 3 : 2,
        speed: enemyType === 1 ? 150 : enemyType === 2 ? 190 : enemyType === 3 ? 230 : 110,
        drift: rand(-80, 80),
        shootTimer: rand(0.6, 1.6),
        value: enemyType === 4 ? 500 : 50 + world.level * 25
      };
      world.enemies.push(enemy);
    }

    function fireBullet(owner, angle, speed, color, size = 4) {
      world.bullets.push({
        owner,
        x: owner.x + (owner.w || 0) / 2,
        y: owner.y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        color,
        size,
        damage: owner === 'player' ? 1 : 10
      });
    }

    function handleInput(dt) {
      if (!world.player) return;
      let dx = 0;
      let dy = 0;
      if (keys['w'] || keys['arrowup']) dy -= 1;
      if (keys['s'] || keys['arrowdown']) dy += 1;
      if (keys['a'] || keys['arrowleft']) dx -= 1;
      if (keys['d'] || keys['arrowright']) dx += 1;
      if (dx || dy) {
        const len = Math.hypot(dx, dy) || 1;
        world.player.x += (dx / len) * world.player.speed * dt;
        world.player.y += (dy / len) * world.player.speed * dt;
      }

      world.player.x = Math.max(world.leftBound, Math.min(world.rightBound, world.player.x));
      world.player.y = Math.max(30, Math.min(world.height - 30, world.player.y));

      world.player.fireCooldown -= dt;
      if ((keys[' '] || keys['space']) && world.player.fireCooldown <= 0) {
        fireBullet('player', 0, 540, '#7ee7ff', 4);
        world.player.fireCooldown = 0.18;
      }
    }

    function updateBullets(dt) {
      for (let i = world.bullets.length - 1; i >= 0; i--) {
        const b = world.bullets[i];
        b.x += b.vx * dt;
        b.y += b.vy * dt;

        if (b.x < -20 || b.x > world.width + 20 || b.y < -20 || b.y > world.height + 20) {
          world.bullets.splice(i, 1);
          continue;
        }

        if (b.owner === 'player') {
          for (let j = world.enemies.length - 1; j >= 0; j--) {
            const e = world.enemies[j];
            if (rectHit(b.x, b.y, b.size, b.size, e.x - e.w / 2, e.y - e.h / 2, e.w, e.h)) {
              e.health -= b.damage;
              world.bullets.splice(i, 1);
              addParticles(b.x, b.y, b.color, 8);
              if (e.health <= 0) {
                world.kills += 1;
                world.score += e.value;
                addParticles(e.x, e.y, '#ffd166', 26);
                world.enemies.splice(j, 1);
              }
              break;
            }
          }
        } else {
          if (rectHit(b.x, b.y, b.size, b.size, world.player.x - world.player.w / 2, world.player.y - world.player.h / 2, world.player.w, world.player.h)) {
            world.player.health -= b.damage;
            world.player.hitFlash = 0.25;
            world.bullets.splice(i, 1);
            addParticles(world.player.x, world.player.y, '#ff5b5b', 14);
            if (world.player.health <= 0) gameOver();
          }
        }
      }
    }

    function rectHit(ax, ay, aw, ah, bx, by, bw, bh) {
      return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
    }

    function updateEnemies(dt) {
      for (let i = world.enemies.length - 1; i >= 0; i--) {
        const e = world.enemies[i];

        if (e.type === 4) {
          e.y += Math.sin((performance.now() / 1000) + i) * 80 * dt;
          e.x += -110 * dt;
        } else {
          e.x -= e.speed * dt;
          e.y += Math.sin((performance.now() / 800) + i) * e.drift * dt;
        }

        e.shootTimer -= dt;
        if (e.shootTimer <= 0 && e.type >= 2) {
          const angle = Math.atan2(world.player.y - e.y, world.player.x - e.x);
          fireBullet('enemy', angle, e.type === 4 ? 240 : 220, e.type === 4 ? '#ff9a3d' : '#ff5ea8', e.type === 4 ? 6 : 4);
          e.shootTimer = e.type === 4 ? 0.9 : rand(1.2, 2.0);
        }

        if (rectHit(e.x - e.w / 2, e.y - e.h / 2, e.w, e.h, world.player.x - world.player.w / 2, world.player.y - world.player.h / 2, world.player.w, world.player.h)) {
          world.player.health -= e.type === 4 ? 26 : 16;
          world.player.hitFlash = 0.35;
          world.enemies.splice(i, 1);
          addParticles(e.x, e.y, '#ff5b5b', 20);
          if (world.player.health <= 0) gameOver();
          continue;
        }

        if (e.x < -200) {
          world.enemies.splice(i, 1);
        }
      }
    }

    function updateParticles(dt) {
      for (let i = world.particles.length - 1; i >= 0; i--) {
        const p = world.particles[i];
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.life -= dt;
        if (p.life <= 0) world.particles.splice(i, 1);
      }
    }

    function advanceLevel() {
      if (world.level < 3) {
        world.level += 1;
        world.goal = world.level === 1 ? 8 : world.level === 2 ? 10 : 1;
        world.enemySpawnDelay = world.level === 3 ? 0.85 : Math.max(0.55, 1.25 - world.level * 0.12);
        world.kills = 0;
      } else {
        victory();
      }
      updateHud();
    }

    function updateLevelState() {
      if (world.level === 0 && world.kills >= 6) {
        advanceLevel();
      } else if (world.level === 1 && world.kills >= 8) {
        advanceLevel();
      } else if (world.level === 2 && world.kills >= 10) {
        advanceLevel();
      } else if (world.level === 3 && world.kills >= 1) {
        victory();
      }
    }

    function update(dt) {
      if (!world.active) return;

      handleInput(dt);
      world.player.hitFlash = Math.max(0, world.player.hitFlash - dt);
      updateHud();

      world.enemySpawnTimer -= dt;
      if (world.enemySpawnTimer <= 0) {
        spawnEnemy();
        world.enemySpawnTimer = world.enemySpawnDelay;
      }

      updateEnemies(dt);
      updateBullets(dt);
      updateParticles(dt);
      updateLevelState();

      for (const star of world.stars) {
        star.y += star.speed * dt * 10;
        if (star.y > world.height) {
          star.y = -10;
          star.x = rand(0, world.width);
        }
      }
    }

    function drawBackground() {
      const paletteSet = palette[world.level] || palette[0];
      const gradient = ctx.createLinearGradient(0, 0, 0, world.height);
      gradient.addColorStop(0, paletteSet.skyTop);
      gradient.addColorStop(1, paletteSet.skyBottom);
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, world.width, world.height);

      for (const star of world.stars) {
        ctx.fillStyle = `rgba(255,255,255,${star.alpha})`;
        ctx.beginPath();
        ctx.arc(star.x, star.y, star.r, 0, Math.PI * 2);
        ctx.fill();
      }

      if (world.level === 0) {
        ctx.fillStyle = 'rgba(123, 214, 255, 0.24)';
        for (let i = 0; i < 7; i++) {
          const x = i * 190 + (performance.now() / 25 % 220);
          ctx.beginPath();
          ctx.arc(x, 150 + (i % 2) * 40, 70, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      if (world.level === 1) {
        ctx.fillStyle = 'rgba(255, 154, 145, 0.45)';
        ctx.beginPath();
        ctx.arc(880, 120, 110, 0, Math.PI * 2);
        ctx.fill();
      }

      if (world.level === 2) {
        ctx.fillStyle = 'rgba(194, 210, 255, 0.35)';
        ctx.beginPath();
        ctx.arc(820, 180, 140, 0, Math.PI * 2);
        ctx.fill();
      }

      if (world.level === 3) {
        ctx.fillStyle = 'rgba(255, 146, 45, 0.7)';
        ctx.beginPath();
        ctx.arc(980, 360, 230, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function drawShip(x, y, size, tint) {
      ctx.save();
      ctx.translate(x, y);
      ctx.fillStyle = tint;
      ctx.beginPath();
      ctx.moveTo(-size * 0.8, 0);
      ctx.lineTo(-size * 0.2, -size * 0.5);
      ctx.lineTo(size * 0.6, 0);
      ctx.lineTo(-size * 0.2, size * 0.5);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = '#dff6ff';
      ctx.fillRect(-size * 0.15, -size * 0.15, size * 0.55, size * 0.3);
      ctx.restore();
    }

    function drawEnemy(enemy) {
      const c = enemy.type === 1 ? '#6edbff' : enemy.type === 2 ? '#ff7ca7' : enemy.type === 3 ? '#ffd166' : '#ff6e3d';
      if (enemy.type === 4) {
        ctx.save();
        ctx.translate(enemy.x, enemy.y);
        ctx.fillStyle = '#ff874a';
        ctx.beginPath();
        ctx.moveTo(-50, 0);
        ctx.lineTo(-10, -42);
        ctx.lineTo(35, -16);
        ctx.lineTo(58, 0);
        ctx.lineTo(35, 16);
        ctx.lineTo(-10, 42);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = '#ffd7a8';
        ctx.fillRect(-8, -14, 34, 28);
        ctx.restore();
      } else {
        drawShip(enemy.x, enemy.y, enemy.type === 1 ? 22 : enemy.type === 2 ? 18 : 16, c);
      }
    }

    function drawPlayer() {
      const p = world.player;
      if (!p) return;
      ctx.save();
      ctx.translate(p.x, p.y);
      const flash = p.hitFlash > 0 ? 1 : 0.2;
      ctx.fillStyle = flash ? '#fff' : '#8af6ff';
      ctx.beginPath();
      ctx.moveTo(-22, 0);
      ctx.lineTo(-8, -12);
      ctx.lineTo(20, -5);
      ctx.lineTo(30, 0);
      ctx.lineTo(20, 5);
      ctx.lineTo(-8, 12);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = '#dff6ff';
      ctx.fillRect(-4, -8, 18, 16);
      ctx.restore();
    }

    function drawBullets() {
      for (const bullet of world.bullets) {
        ctx.fillStyle = bullet.color;
        ctx.beginPath();
        ctx.arc(bullet.x, bullet.y, bullet.size, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function drawParticles() {
      for (const p of world.particles) {
        ctx.fillStyle = p.color;
        ctx.globalAlpha = Math.max(0, p.life);
        ctx.fillRect(p.x, p.y, p.size, p.size);
      }
      ctx.globalAlpha = 1;
    }

    function drawStatusText() {
      if (!world.active) return;
      ctx.fillStyle = 'rgba(220,240,255,0.85)';
      ctx.font = 'bold 20px Segoe UI';
      ctx.fillText(`Level ${world.level + 1}: ${levelNames[world.level]}`, 30, 42);
      ctx.fillStyle = 'rgba(220,240,255,0.7)';
      ctx.font = '14px Segoe UI';
      const target = world.level === 0 ? 6 : world.level === 1 ? 8 : world.level === 2 ? 10 : 1;
      ctx.fillText(`Kills ${world.kills}/${target}`, 30, 66);
    }

    function render() {
      drawBackground();
      drawBullets();
      for (const enemy of world.enemies) drawEnemy(enemy);
      drawPlayer();
      drawParticles();
      drawStatusText();
    }

    document.addEventListener('keydown', (e) => {
      const key = e.key.toLowerCase();
      keys[key] = true;
      if (key === 'escape' && world.active) {
        world.active = false;
        overlay.classList.remove('hidden');
        overlay.querySelector('h1').textContent = 'Paused';
        overlay.querySelector('.tagline').textContent = 'Press start to continue.';
        startBtn.textContent = 'Resume';
      }
      if ((key === 'enter' || key === ' ') && !world.active && !overlay.classList.contains('hidden')) {
        startBtn.click();
      }
      if ([' ', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright'].includes(key)) e.preventDefault();
    });

    document.addEventListener('keyup', (e) => {
      keys[e.key.toLowerCase()] = false;
    });

    startBtn.addEventListener('click', () => {
      if (!world.active && overlay.querySelector('h1').textContent === 'Paused') {
        world.active = true;
        overlay.classList.add('hidden');
      } else {
        startGame();
      }
    });

    let lastTime = 0;
    function tick(timestamp) {
      const dt = Math.min((timestamp - lastTime) / 1000, 0.033);
      lastTime = timestamp;
      update(dt);
      render();
      requestAnimationFrame(tick);
    }

    resetGame();
    overlay.classList.remove('hidden');
    overlay.querySelector('h1').textContent = 'Colony Defense';
    overlay.querySelector('.tagline').textContent = 'Destroy the Solar Empire. Survive.';
    startBtn.textContent = 'Start Mission';
    requestAnimationFrame(tick);
  </script>
</body>
</html>
