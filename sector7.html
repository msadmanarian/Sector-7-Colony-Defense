<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SECTOR 7 : PLANETARY DEFENSE</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
    font-family: monospace;
  }
  canvas {
    display: block;
    image-rendering: pixelated;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const WIN_W = 900, WIN_H = 600;
const UI_W = 100, GX0 = 101, GX1 = 900;
const PI = Math.PI;

canvas.width = WIN_W;
canvas.height = WIN_H;

// --- Scale canvas to fit viewport ---
function resizeCanvas() {
  const scale = Math.min(window.innerWidth / WIN_W, window.innerHeight / WIN_H);
  canvas.style.width = (WIN_W * scale) + 'px';
  canvas.style.height = (WIN_H * scale) + 'px';
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

// --- State ---
const STATE = { MENU:0, PLAYING:1, LEVEL_COMPLETE:2, GAME_OVER:3, VICTORY:4 };
const LEVEL = { EARTH:0, VENUS:1, MERCURY:2, SUN_BOSS:3 };
let gameState = STATE.MENU;
let currentLevel = LEVEL.EARTH;

// --- Input ---
const keys = {}, skeys = {};
document.addEventListener('keydown', e => {
  keys[e.key] = true;
  if ((e.key === 'Enter') && (gameState === STATE.MENU || gameState === STATE.GAME_OVER || gameState === STATE.VICTORY)) {
    initGame(); gameState = STATE.PLAYING;
  }
  if (e.key === 'Escape') { gameState = STATE.MENU; }
  e.preventDefault();
});
document.addEventListener('keyup', e => { keys[e.key] = false; });

// --- Utility ---
function rnd(lo, hi) { return lo + (hi - lo) * Math.random(); }
function pseudoRandom(i) { return ((i * 9301 + 49297) % 233280) / 233280; }
function rectHit(ax,ay,aw,ah,bx,by,bw,bh) {
  return ax < bx+bw && ax+aw > bx && ay < by+bh && ay+ah > by;
}

// --- Game Objects ---
let player, boss, enemies, bullets, particles;
let meteors, pstars, spaceRocks;
let score, colonyHP, pilotHP, enemiesKilled, killsNeeded;
let spawnTimer, spawnInterval, gameTime, bulletTimer, droneFireT, bossFireT;
let levelTransitionTimer, warnFlash;

// --- Particle Spawn ---
function spawnParticles(x, y, n, r, g, b) {
  for (let i = 0; i < n; i++) {
    const a = rnd(0, 2*PI), s = rnd(0.5, 4.5), life = rnd(0.3, 1.4);
    particles.push({x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s, life, maxLife: life, r, g, b, size: rnd(2,6)});
  }
}

// --- Init Scenery ---
function initScenery() {
  meteors = [];
  for (let i = 0; i < 25; i++) {
    const m = { x: rnd(-2,2), y: rnd(-1,1), size: rnd(0.03,0.08), speed: rnd(0.5,1.0), rot: rnd(0,360), rotSpeed: rnd(-1.5,1.5), offsets: [] };
    for (let j = 0; j < 8; j++) m.offsets.push(rnd(0.7,1.3));
    meteors.push(m);
  }
  pstars = [];
  for (let i = 0; i < 400; i++) {
    const sp = rnd(0.2, 1.2);
    pstars.push({ x: rnd(0, WIN_W), y: rnd(0, WIN_H), speed: sp, size: sp * 1.5, bright: rnd(0.3, 1.0) });
  }
  spaceRocks = [];
  for (let i = 0; i < 80; i++) {
    const rock = { x: rnd(0, WIN_W-300), y: rnd(0, WIN_H), size: rnd(20,75), rot: rnd(0,360), rotSpd: rnd(-1.5,1.5), points: [] };
    for (let j = 0; j < 12; j++) {
      const a = j * 30 * PI / 180, d = rock.size * rnd(0.5, 1.3);
      rock.points.push([d * Math.cos(a), d * Math.sin(a)]);
    }
    spaceRocks.push(rock);
  }
}

// --- Init Game ---
function initGame() {
  player = { x: 160, y: WIN_H/2, vx:0, vy:0, w:42, h:22, active:true, health:100 };
  boss = { active: false };
  enemies = []; bullets = []; particles = [];
  score = 0; colonyHP = 100; pilotHP = 100;
  enemiesKilled = 0; killsNeeded = 5;
  spawnTimer = 0; spawnInterval = 2.0;
  gameTime = 0; bulletTimer = 0; droneFireT = 0; bossFireT = 0;
  levelTransitionTimer = 0; warnFlash = 0;
  currentLevel = LEVEL.EARTH;
  initScenery();
}

// --- Advance Level ---
function advanceLevel() {
  enemiesKilled = 0; enemies = []; bullets = [];
  if (currentLevel === LEVEL.EARTH) { currentLevel = LEVEL.VENUS; killsNeeded = 5; spawnInterval = 1.8; }
  else if (currentLevel === LEVEL.VENUS) { currentLevel = LEVEL.MERCURY; killsNeeded = 6; spawnInterval = 1.5; }
  else if (currentLevel === LEVEL.MERCURY) {
    currentLevel = LEVEL.SUN_BOSS;
    boss = { active:true, type:4, x: WIN_W-120, y: WIN_H/2, vx:0, vy:1.2, w:100, h:100, health:40 };
  }
}

// --- Spawn Enemy ---
function spawnEnemy() {
  const e = { active: true, x: WIN_W + 20, y: rnd(60, WIN_H-60) };
  if (currentLevel === LEVEL.EARTH) {
    e.y = rnd(WIN_H/2+40, WIN_H-60); e.type = 1;
    e.vx = -(2.0 + score/900); e.vy = rnd(-0.5,0.5);
    e.w = 75; e.h = 60; e.health = 2;
  } else if (currentLevel === LEVEL.VENUS) {
    e.type = 2; e.vx = -(2.2 + score/800); e.vy = rnd(-0.6,0.6);
    e.w = 44; e.h = 28; e.health = 2;
  } else if (currentLevel === LEVEL.MERCURY) {
    e.type = 3; e.vx = -(2.0 + score/700); e.vy = rnd(-0.5,0.5);
    e.w = 50; e.h = 30; e.health = 3;
  }
  enemies.push(e);
}

// --- Level Colors ---
function getLevelColor() {
  switch(currentLevel) {
    case LEVEL.EARTH:    return [0.3, 0.7, 1.0];
    case LEVEL.VENUS:    return [0.9, 0.7, 0.3];
    case LEVEL.MERCURY:  return [0.6, 0.6, 0.65];
    case LEVEL.SUN_BOSS: return [1.0, 0.3, 0.0];
  }
}
function getLevelName() {
  switch(currentLevel) {
    case LEVEL.EARTH:    return 'EARTH SKIES';
    case LEVEL.VENUS:    return 'VENUS ASSAULT';
    case LEVEL.MERCURY:  return 'MERCURY STRIKE';
    case LEVEL.SUN_BOSS: return 'SUN TITAN BOSS';
  }
}

// ============================================================
// DRAW HELPERS
// ============================================================
function rgb(r,g,b,a=1) { return `rgba(${Math.round(r*255)},${Math.round(g*255)},${Math.round(b*255)},${a})`; }

function fillCircle(cx, cy, r, colR, colG, colB, alpha=1) {
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, 2*PI);
  ctx.fillStyle = rgb(colR, colG, colB, alpha);
  ctx.fill();
}

function poly(pts, fillColor, strokeColor, lineWidth=1) {
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.closePath();
  if (fillColor) { ctx.fillStyle = fillColor; ctx.fill(); }
  if (strokeColor) { ctx.strokeStyle = strokeColor; ctx.lineWidth = lineWidth; ctx.stroke(); }
}

// ============================================================
// BACKGROUND DRAWING
// ============================================================
function drawEarthBackground() {
  const t = gameTime;
  const scrollSky = (t * 0.05 * (WIN_W-GX0)) % (WIN_W-GX0);
  const scrollBG  = (t * 0.1  * (WIN_W-GX0)) % (WIN_W-GX0);
  const scrollMG  = (t * 0.2  * (WIN_W-GX0)) % (WIN_W-GX0);
  const scrollFG  = (t * 0.4  * (WIN_W-GX0)) % (WIN_W-GX0);

  // Sky
  ctx.fillStyle = rgb(0.52, 0.8, 0.98);
  ctx.fillRect(GX0, 0, WIN_W-GX0, WIN_H);

  // Scrolling clouds
  function drawClouds(offX) {
    ctx.save(); ctx.translate(offX, 0);
    const positions = [[-0.15*WIN_W+GX0, WIN_H*0.2], [0.3*WIN_W+GX0, WIN_H*0.15], [0.55*(WIN_W-GX0)+GX0, WIN_H*0.22]];
    positions.forEach(([cx, cy]) => {
      ctx.fillStyle = 'rgba(255,255,255,0.9)';
      [[0,0,45],[35,10,50],[75,0,45]].forEach(([dx,dy,r]) => { ctx.beginPath(); ctx.arc(cx+dx, cy+dy, r, 0, 2*PI); ctx.fill(); });
    });
    ctx.restore();
  }
  drawClouds(-scrollSky); drawClouds(-scrollSky + (WIN_W-GX0));

  // Background buildings
  function drawBGBuildings(offX) {
    ctx.save(); ctx.translate(offX, 0);
    const bgs = [[GX0, 0.55, 0.22, 0.6], [GX0+0.15*(WIN_W-GX0), 0.65, 0.2, 0.75], [GX0+0.65*(WIN_W-GX0), 0.65, 0.18, 0.65], [GX0+0.8*(WIN_W-GX0), 0.65, 0.2, 0.55]];
    bgs.forEach(([x, h, w, _]) => {
      ctx.fillStyle = rgb(0.65, 0.82, 0.88);
      ctx.fillRect(x, WIN_H*(1-h)-WIN_H*0.2, (WIN_W-GX0)*w, WIN_H*h);
    });
    ctx.restore();
  }
  drawBGBuildings(-scrollBG); drawBGBuildings(-scrollBG + (WIN_W-GX0));

  // Midground buildings
  function drawMGBuildings(offX) {
    ctx.save(); ctx.translate(offX, 0);
    [[GX0, 0.4, 0.2],[GX0+0.18*(WIN_W-GX0), 0.7, 0.25],[GX0+0.45*(WIN_W-GX0), 0.5, 0.2],[GX0+0.7*(WIN_W-GX0), 0.6, 0.15]].forEach(([x,h,w]) => {
      ctx.fillStyle = rgb(0.45, 0.68, 0.75);
      ctx.fillRect(x, WIN_H*(1-h)-WIN_H*0.2, (WIN_W-GX0)*w, WIN_H*h);
    });
    ctx.restore();
  }
  drawMGBuildings(-scrollMG); drawMGBuildings(-scrollMG + (WIN_W-GX0));

  // Ground & FG
  function drawFG(offX) {
    ctx.save(); ctx.translate(offX, 0);
    ctx.fillStyle = rgb(0.45, 0.8, 0.4);
    ctx.fillRect(GX0, WIN_H*0.6, WIN_W-GX0, WIN_H*0.15);
    ctx.fillStyle = rgb(0.3, 0.3, 0.3);
    ctx.fillRect(GX0, WIN_H*0.75, WIN_W-GX0, WIN_H*0.1);
    // Road markings
    ctx.fillStyle = 'white';
    for (let x = GX0; x < WIN_W; x += 90) ctx.fillRect(x, WIN_H*0.785, 50, 5);
    // Trees
    [[GX0+50, WIN_H*0.6],[GX0+200,WIN_H*0.6],[GX0+400,WIN_H*0.6],[GX0+550,WIN_H*0.6],[GX0+700,WIN_H*0.6]].forEach(([tx,ty]) => {
      ctx.fillStyle = rgb(0.4, 0.25, 0.1); ctx.fillRect(tx-4, ty, 8, 40);
      ctx.fillStyle = rgb(0.2, 0.6, 0.2); ctx.beginPath(); ctx.arc(tx, ty, 35, 0, 2*PI); ctx.fill();
    });
    ctx.restore();
  }
  drawFG(-scrollFG); drawFG(-scrollFG + (WIN_W-GX0));
}

function drawVenusBackground() {
  const t = gameTime;
  // Sky gradient
  const grad = ctx.createLinearGradient(GX0, WIN_H, WIN_W, 0);
  grad.addColorStop(0, rgb(0.55, 0.12, 0.35));
  grad.addColorStop(1, rgb(0.19, 0.08, 0.25));
  ctx.fillStyle = grad;
  ctx.fillRect(GX0, 0, WIN_W-GX0, WIN_H);

  // Stars
  for (let i = 0; i < 20; i++) {
    const sx = WIN_W - ((i * 87 + t * 30) % (WIN_W-GX0));
    const sy = 250 + (i * 123 % (WIN_H-250));
    const pulse = 0.5 + 0.5 * Math.sin(t * 3 + i);
    ctx.fillStyle = rgb(1.0, 0.8, 0.9, pulse);
    ctx.beginPath(); ctx.arc(sx, sy, 2, 0, 2*PI); ctx.fill();
  }

  // Giant planet top-left
  const pX = GX0+150, pY = WIN_H-120, pR = 80;
  fillCircle(pX, pY, pR*1.4, 0.85, 0.4, 0.6, 0.15);
  fillCircle(pX, pY, pR, 0.85, 0.4, 0.6, 0.9);

  // Planet ring
  ctx.save(); ctx.translate(pX, pY); ctx.rotate(20*PI/180);
  ctx.strokeStyle = rgb(0.9, 0.6, 0.7, 0.8); ctx.lineWidth = 4;
  ctx.beginPath(); ctx.ellipse(0, 0, 160, 25, 0, 0, 2*PI); ctx.stroke();
  ctx.restore();

  // Mountains scrolling
  const scrollSlow = (t * 15) % 300, scrollFast = (t * 30) % 400;
  function drawMountain(x, y, w, h) {
    // Shadow
    ctx.fillStyle = rgb(0.07, 0.03, 0.15);
    poly([[x, y],[x+w*0.2, y+h],[x+w*0.6, y]], rgb(0.07,0.03,0.15));
    // Lit
    ctx.fillStyle = rgb(0.85, 0.16, 0.41);
    poly([[x-w*0.5, y],[x+w*0.2, y+h],[x, y]], rgb(0.85,0.16,0.41));
  }
  for (let i = -2; i < 5; i++) drawMountain(GX0 + i*300 - scrollSlow, 100, 350, 250);
  for (let i = -2; i < 4; i++) drawMountain(GX0 + i*400 - scrollFast, 60, 450, 350);

  // Dunes
  function drawDune(baseY, amp, freq, speed, topR,topG,topB, botR,botG,botB) {
    const grad2 = ctx.createLinearGradient(0, baseY+amp, 0, 0);
    grad2.addColorStop(0, rgb(topR,topG,topB));
    grad2.addColorStop(1, rgb(botR,botG,botB));
    ctx.fillStyle = grad2;
    ctx.beginPath();
    ctx.moveTo(GX0, 0);
    for (let x = GX0; x <= WIN_W+40; x += 20) {
      const y = baseY + Math.sin(x * freq + t * speed) * amp;
      ctx.lineTo(x, y);
    }
    ctx.lineTo(WIN_W+40, 0); ctx.closePath(); ctx.fill();
  }
  drawDune(80, 25, 0.015, 1.5, 0.55,0.05,0.35, 0.07,0.03,0.15);
  drawDune(45, 15, 0.02,  2.5, 0.80,0.10,0.40, 0.05,0.02,0.10);
  drawDune(15, 10, 0.012, 3.5, 0.95,0.20,0.50, 0.02,0.01,0.05);
}

function drawMercuryBackground() {
  const t = gameTime;
  // Sky gradient
  const grad = ctx.createLinearGradient(GX0, WIN_H, WIN_W, 0);
  grad.addColorStop(0, rgb(0.10, 0.25, 0.35));
  grad.addColorStop(1, rgb(0.02, 0.08, 0.15));
  ctx.fillStyle = grad;
  ctx.fillRect(GX0, 0, WIN_W-GX0, WIN_H);

  // Stars
  for (let i = 0; i < 60; i++) {
    const alpha = 0.3 + 0.7 * Math.sin(t*2 + i);
    ctx.fillStyle = rgb(0.8, 0.9, 1.0, alpha);
    ctx.beginPath(); ctx.arc(GX0 + pseudoRandom(i)*(WIN_W-GX0), WIN_H*0.3 + pseudoRandom(i+100)*(WIN_H*0.7), 1.5, 0, 2*PI); ctx.fill();
  }

  // Giant ice planet
  const pX = GX0+320, pY = WIN_H/2+30, pR = 120;
  fillCircle(pX, pY, pR, 0.05, 0.15, 0.25, 1.0);
  // Crescent
  ctx.fillStyle = rgb(0.2, 0.5, 0.7, 0.8);
  ctx.beginPath();
  for (let i = 90; i <= 270; i++) ctx.lineTo(pX + Math.cos(i*PI/180)*pR, pY + Math.sin(i*PI/180)*pR);
  for (let i = 270; i >= 90; i--) ctx.lineTo(pX+15 + Math.cos(i*PI/180)*pR*0.85, pY-15 + Math.sin(i*PI/180)*pR*0.85);
  ctx.fill();

  // Rings
  ctx.save(); ctx.translate(pX, pY); ctx.rotate(-35*PI/180);
  ctx.strokeStyle = rgb(0.6, 0.8, 1.0, 0.6); ctx.lineWidth = 2;
  ctx.beginPath(); ctx.ellipse(0, 0, 240, 40, 0, 0, 2*PI); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(0, 0, 260, 45, 0, 0, 2*PI); ctx.stroke();
  ctx.restore();

  // Icy dunes
  function drawDune(baseY, amp, freq, topR,topG,topB) {
    const grad2 = ctx.createLinearGradient(0, baseY+amp, 0, 0);
    grad2.addColorStop(0, rgb(topR,topG,topB));
    grad2.addColorStop(1, rgb(0.02, 0.05, 0.10));
    ctx.fillStyle = grad2;
    ctx.beginPath(); ctx.moveTo(GX0, 0);
    for (let x = GX0; x <= WIN_W+40; x += 20) ctx.lineTo(x, baseY + Math.sin(x*freq)*amp);
    ctx.lineTo(WIN_W+40, 0); ctx.closePath(); ctx.fill();
  }
  drawDune(120, 25, 0.01, 0.2, 0.35, 0.5);
  drawDune(80,  15, 0.015, 0.4, 0.6, 0.75);
  drawDune(40,  10, 0.008, 0.6, 0.75, 0.85);

  // Meteors
  const gW = WIN_W - GX0, gH = WIN_H;
  for (const m of meteors) {
    const sx = GX0 + (m.x + 1.5) / 3.0 * gW;
    const sy = (m.y + 1.0) / 2.0 * gH;
    const sr = m.size * gW / 3.0;
    ctx.save(); ctx.translate(sx, sy); ctx.rotate(m.rot*PI/180);
    ctx.fillStyle = rgb(0.22, 0.2, 0.18);
    ctx.beginPath();
    for (let i = 0; i <= 8; i++) {
      const angle = (i%8) * (360/8) * PI / 180;
      const r = sr * m.offsets[i%8];
      if (i===0) ctx.moveTo(Math.cos(angle)*r, Math.sin(angle)*r);
      else ctx.lineTo(Math.cos(angle)*r, Math.sin(angle)*r);
    }
    ctx.closePath(); ctx.fill(); ctx.restore();
  }

  // Mercury planet
  const mpX = GX0 + (0.6+1.5)/3.0 * (WIN_W-GX0);
  const mpY = (-(-0.2)+1.0)/2.0 * WIN_H;
  const mpR = 0.44 * (WIN_W-GX0) / 3.0;
  const lgr = ctx.createRadialGradient(mpX-mpR*0.3, mpY-mpR*0.3, 0, mpX, mpY, mpR);
  lgr.addColorStop(0, rgb(0.5,0.48,0.44));
  lgr.addColorStop(1, rgb(0.12,0.11,0.10));
  ctx.fillStyle = lgr;
  ctx.beginPath(); ctx.arc(mpX, mpY, mpR, 0, 2*PI); ctx.fill();
}

function drawSunBackground() {
  ctx.fillStyle = '#000';
  ctx.fillRect(GX0, 0, WIN_W-GX0, WIN_H);

  // Stars
  for (const s of pstars) {
    if (s.x < GX0 || s.x > WIN_W) continue;
    ctx.fillStyle = rgb(s.bright*0.5, s.bright*0.6, s.bright);
    ctx.beginPath(); ctx.arc(s.x, s.y, s.size/2, 0, 2*PI); ctx.fill();
  }

  // Giant sun
  const sx = WIN_W - 50, sy = WIN_H / 2;
  function sunCircle(radius, R, G, B) {
    const grad = ctx.createRadialGradient(sx, sy, 0, sx, sy, radius);
    grad.addColorStop(0, rgb(R,G,B,1)); grad.addColorStop(1, rgb(R,G,B,0));
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(sx, sy, radius, 0, 2*PI); ctx.fill();
  }
  sunCircle(450, 0.8, 0.1, 0.0);
  sunCircle(325, 1.0, 0.4, 0.0);
  sunCircle(225, 1.0, 0.7, 0.0);
  sunCircle(125, 1.0, 0.95, 0.7);

  // Flares
  for (let i = 0; i < 150; i++) {
    const a = (i*15 + gameTime*20) * PI / 180;
    const d = 250 * (0.6 + pseudoRandom(i) * 1.2);
    ctx.fillStyle = (i%2===0) ? rgb(1,0.5,0) : rgb(1,0.8,0);
    ctx.beginPath(); ctx.arc(sx + d*Math.cos(a), sy + d*Math.sin(a), 2, 0, 2*PI); ctx.fill();
  }
}

function drawLevelBackground() {
  switch(currentLevel) {
    case LEVEL.EARTH:    drawEarthBackground(); break;
    case LEVEL.VENUS:    drawVenusBackground(); break;
    case LEVEL.MERCURY:  drawMercuryBackground(); break;
    case LEVEL.SUN_BOSS: drawSunBackground(); break;
  }
}

// ============================================================
// SHIP DRAWINGS
// ============================================================
function drawPlayer(x, y) {
  ctx.save(); ctx.translate(x, y);
  // Main hull
  poly([[ 45,  0],[27,  9],[12, 15],[-7, 18],[-27,12],[-36,0],[-27,-12],[-7,-18],[12,-15],[27,-9]], rgb(0.1,0.05,0.15));
  // Wings
  ctx.fillStyle = rgb(0.35, 0.05, 0.05);
  poly([[-7,15],[-30,42],[-42,30],[-18,13]], rgb(0.35,0.05,0.05));
  poly([[-7,-15],[-30,-42],[-42,-30],[-18,-13]], rgb(0.35,0.05,0.05));
  // Cockpit eye
  poly([[27,0],[12,7],[12,-7]], rgb(1,0.1,0));
  poly([[22,0],[15,3],[15,-3]], rgb(1,0.6,0.1));
  // Engine
  poly([[-33,9],[-57,3],[-33,-9]], rgb(0.8,0.2,0));
  poly([[-33,6],[-51,0],[-33,-6]], rgb(1,0.4,0));
  // Mandibles
  poly([[33,4],[51,18],[42,3]], rgb(0.45,0.05,0.05));
  poly([[33,-4],[51,-18],[42,-3]], rgb(0.45,0.05,0.05));
  ctx.restore();
}

function drawModernPlayer(x, y) {
  ctx.save(); ctx.translate(x, y);
  const pulse = 0.8 + 0.2 * Math.sin(gameTime*25);
  // Exhaust
  ctx.fillStyle = rgb(0,0.6*pulse,1);
  poly([[-39,6],[-68-9*pulse,6],[-39,1.5]], rgb(0,0.6*pulse,1));
  poly([[-39,-1.5],[-68-9*pulse,-6],[-39,-6]], rgb(0,0.6*pulse,1));
  // Hull
  poly([[48,0],[22,10],[-18,12],[-36,7],[-36,-7],[-18,-12],[22,-10]], rgb(0.85,0.88,0.90));
  // Center stripe
  poly([[18,0],[-7,6],[-27,7],[-27,-7],[-7,-6]], rgb(0.25,0.28,0.32));
  // Wings

    ctx.fillStyle = rgb(0.1,0.1,0.15); ctx.fillRect(x-2,y-2,w+4,h+4);

        ctx.fillStyle = rgb(Math.min(1,r+0.4),Math.min(1,g+0.4),Math.min(1,b+0.4));

  const cx = UI_W/2, cy = 100;

    if(dir===2) ctx.rotate(PI);
    if(dir===3) ctx.rotate(PI/2);

    ctx.fillRect(-3,-9,6,6); ctx.fillRect(-6,−3,12,4); ctx.fillRect(-3,1,6,6);

    ctx.closePath(); ctx.fill();

// ============================================================
// UPDATE
// ============================================================
let lastTime = 0;
function update(timestamp) {
  requestAnimationFrame(update);
  const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
  lastTime = timestamp;

  gameTime += dt;

  if (gameState === STATE.MENU || gameState === STATE.GAME_OVER || gameState === STATE.VICTORY) {
    ctx.clearRect(0,0,WIN_W,WIN_H);
    if (gameState === STATE.MENU) drawMenu();
    else drawEndScreen();
    return;
  }

  if (gameState === STATE.LEVEL_COMPLETE) {
    levelTransitionTimer += dt;
    if (levelTransitionTimer > 3.0) { advanceLevel(); gameState = STATE.PLAYING; levelTransitionTimer = 0; }
    ctx.clearRect(0,0,WIN_W,WIN_H);
    drawLevelBackground();
    drawLevelCompleteScreen();
    return;
  }

  bulletTimer += dt; droneFireT += dt; bossFireT += dt; spawnTimer += dt;

  // Scenery update
  if (currentLevel === LEVEL.MERCURY) {
    for (const m of meteors) {
      m.x -= m.speed * dt;
      m.rot += m.rotSpeed;
      if (m.x < -1.8) { m.x = 1.8; m.y = rnd(-1,1); }
    }
  } else if (currentLevel === LEVEL.SUN_BOSS) {
    for (const s of pstars) {
      s.x -= s.speed * 100 * dt;
      if (s.x < GX0) { s.x = WIN_W; s.y = rnd(0,WIN_H); }
    }
  }

  // Player movement
  const spd = 5.5;
  if (keys['w']||keys['W']||keys['ArrowUp'])    player.y -= spd;
  if (keys['s']||keys['S']||keys['ArrowDown'])  player.y += spd;
  if (keys['a']||keys['A']||keys['ArrowLeft'])  player.x -= spd;
  if (keys['d']||keys['D']||keys['ArrowRight']) player.x += spd;

  const playerMinY = (currentLevel === LEVEL.EARTH) ? WIN_H/2+24 : 32;
  player.x = Math.max(GX0+24, Math.min(player.x, GX1-24));
  player.y = Math.max(playerMinY, Math.min(player.y, WIN_H-32));

  // Fire
  if (keys[' '] && bulletTimer > 0.13) {
    bulletTimer = 0;
    bullets.push({ x: player.x+27, y: player.y, vx: 13, vy: 0, active: true, isEnemy: false, r:0.3, g:0.9, b:1.0 });
  }

  // Spawn enemies
  if (currentLevel !== LEVEL.SUN_BOSS && spawnTimer > spawnInterval) {
    spawnTimer = 0; spawnEnemy();
  }

  // Boss update
  if (boss.active) {
    boss.y += boss.vy;
    if (boss.y < 100 || boss.y > WIN_H-100) boss.vy = -boss.vy;
    if (bossFireT > 0.6) {
      bossFireT = 0;
      for (let i = -1; i <= 1; i++) {
        const dx = player.x - boss.x, dy = player.y - boss.y + i*60;
        const len = Math.sqrt(dx*dx+dy*dy);
        if (len > 0) bullets.push({ x:boss.x-30, y:boss.y+i*20, vx:(dx/len)*5.5, vy:(dy/len)*5.5, active:true, isEnemy:true, r:1,g:0.35,b:0 });
      }
    }
  }

  // Enemy update
  for (const e of enemies) {
    if (!e.active) continue;
    e.x += e.vx; e.y += e.vy;

    if (e.type === 3 && droneFireT > 1.2) {
      droneFireT = 0;
      const dx = player.x-e.x, dy = player.y-e.y, len = Math.sqrt(dx*dx+dy*dy);
      if (len>0 && e.x>GX0) bullets.push({x:e.x-12,y:e.y,vx:(dx/len)*4.5,vy:(dy/len)*4.5,active:true,isEnemy:true,r:0.6,g:0.7,b:0.9});
    }
    if (e.type === 1 && droneFireT > 1.5) {
      droneFireT = 0;
      const dx = player.x-e.x, dy = player.y-e.y, len = Math.sqrt(dx*dx+dy*dy);
      if (len>0 && e.x>GX0) bullets.push({x:e.x-15,y:e.y,vx:(dx/len)*5.0,vy:(dy/len)*5.0,active:true,isEnemy:true,r:1,g:0.8,b:0.2});
    }

    const minY = (e.type === 1) ? WIN_H/2+35 : 32;
    if (e.y < minY || e.y > WIN_H-32) {
      e.vy = -e.vy;
      e.y = Math.max(minY, Math.min(e.y, WIN_H-32));
    }
    if (e.x < UI_W) {
      e.active = false; colonyHP -= 12;
      spawnParticles(UI_W, e.y, 24, 1,0.3,0);
      if (colonyHP <= 0) { colonyHP = 0; gameState = STATE.GAME_OVER; }
    }
  }

  // Bullet update + collision
  for (const b of bullets) {
    if (!b.active) continue;
    b.x += b.vx; b.y += b.vy;
    if (b.x>WIN_W||b.x<GX0||b.y<0||b.y>WIN_H) { b.active=false; continue; }

    if (b.isEnemy) {
      if (rectHit(b.x-5,b.y-5,10,10, player.x-21,player.y-13,42,26)) {
        b.active=false; pilotHP-=10;
        spawnParticles(player.x,player.y,12,0.2,0.7,1);
        if (pilotHP<=0) { pilotHP=0; gameState=STATE.GAME_OVER; }
      }
    } else {
      if (boss.active && rectHit(b.x-5,b.y-5,10,10, boss.x-50,boss.y-50,100,100)) {
        b.active=false; boss.health--;
        spawnParticles(b.x,b.y,15,1,0.5,0);
        if (boss.health<=0) { boss.active=false; score+=1000; spawnParticles(boss.x,boss.y,80,1,0.4,0); gameState=STATE.VICTORY; }
      }
      for (const e of enemies) {
        if (!e.active) continue;
        if (rectHit(b.x-5,b.y-5,10,10, e.x-e.w/2,e.y-e.h/2,e.w,e.h)) {
          b.active=false; e.health--;
          spawnParticles(b.x,b.y,10,1,0.65,0.15);
          if (e.health<=0) {
            e.active=false;
            score += e.type===3?100:e.type===2?75:50;
            enemiesKilled++;
            spawnParticles(e.x,e.y,28,1,0.48,0);
            if (currentLevel!==LEVEL.SUN_BOSS && enemiesKilled>=killsNeeded) gameState=STATE.LEVEL_COMPLETE;
          }
          break;
        }
      }
    }
  }

  // Ram collisions
  for (const e of enemies) {
    if (!e.active) continue;
    if (rectHit(player.x-21,player.y-13,42,26, e.x-e.w/2,e.y-e.h/2,e.w,e.h)) {
      e.active=false; pilotHP-=10;
      spawnParticles(e.x,e.y,35,1,0.45,0);
      if (pilotHP<=0) { pilotHP=0; gameState=STATE.GAME_OVER; }
    }
  }
  if (boss.active && rectHit(player.x-21,player.y-13,42,26, boss.x-50,boss.y-50,100,100)) {
    pilotHP-=30; spawnParticles(player.x,player.y,45,1,0.3,0);
    if (pilotHP<=0) { pilotHP=0; gameState=STATE.GAME_OVER; }
  }

  // Particle decay
  for (const p of particles) { p.x+=p.vx; p.y+=p.vy; p.vx*=0.94; p.vy*=0.94; p.life-=dt; }

  // Cleanup
  enemies  = enemies.filter(e=>e.active);
  bullets  = bullets.filter(b=>b.active);
  particles= particles.filter(p=>p.life>0);

  // --- DRAW ---
  ctx.clearRect(0,0,WIN_W,WIN_H);
  drawLevelBackground();
  drawParticles();

  // Bullets
  for (const b of bullets) {
    if (!b.active) continue;
    ctx.strokeStyle = rgb(b.r*0.55, b.g*0.55, b.b*0.55); ctx.lineWidth=3.5;
    ctx.beginPath(); ctx.moveTo(b.x,b.y); ctx.lineTo(b.x-b.vx*5,b.y-b.vy*5); ctx.stroke();
    ctx.fillStyle = rgb(b.r,b.g,b.b);
    ctx.beginPath(); ctx.arc(b.x,b.y,3,0,2*PI); ctx.fill();
  }

  // Enemies
  for (const e of enemies) {
    if (!e.active) continue;
    if (e.type===1) drawEarthEnemy(e.x, e.y);
    else if (e.type===2) drawVenusUFO(e.x, e.y);
    else if (e.type===3) drawMercuryUFO(e.x, e.y);

    if (e.health > 1) {
      ctx.fillStyle = rgb(0.08,0.08,0.08); ctx.fillRect(e.x-20,e.y-35,40,5);
      const [rr,gg,bb] = getLevelColor();
      ctx.fillStyle = rgb(rr,gg,bb);
      const maxHp = e.type===3?3:2;
      ctx.fillRect(e.x-20,e.y-35,40*(e.health/maxHp),5);
    }
  }

  // Boss
  if (boss.active) drawSunBoss(boss.x, boss.y);

  // Player
  if (player.active) {
    if (currentLevel===LEVEL.EARTH) drawPlayer(player.x, player.y);
    else if (currentLevel===LEVEL.VENUS) drawModernPlayer(player.x, player.y);
    else if (currentLevel===LEVEL.MERCURY) drawMercuryPlayer(player.x, player.y);
    else drawHauntedSolarDestroyer(player.x, player.y);
  }

  drawUI();
  drawHUD();
}

function drawLevelCompleteScreen() {
  ctx.fillStyle = rgba2str(0.15,0.75,0.25);
  ctx.font = '28px monospace'; ctx.fillStyle = rgb(0.15,0.75,0.25);
  let txt = 'LEVEL COMPLETE!';
  ctx.fillText(txt, WIN_W/2 - ctx.measureText(txt).width/2, WIN_H/2+60);
  const names = {[LEVEL.EARTH]:'VENUS ASSAULT',[LEVEL.VENUS]:'MERCURY STRIKE',[LEVEL.MERCURY]:'SUN TITAN BOSS'};
  if (names[currentLevel]) {
    ctx.font='18px monospace'; ctx.fillStyle=rgb(1,0.75,0.25);
    const t2 = 'Next: ' + names[currentLevel];
    ctx.fillText(t2, WIN_W/2-ctx.measureText(t2).width/2, WIN_H/2);
  }
}

function drawEndScreen() {
  if (gameState === STATE.VICTORY) {
    ctx.fillStyle = '#000'; ctx.fillRect(0,0,WIN_W,WIN_H);
    ctx.font='32px monospace'; ctx.fillStyle=rgb(0.25,0.85,0.35);
    let t='VICTORY!'; ctx.fillText(t, WIN_W/2-ctx.measureText(t).width/2, WIN_H/2+60);
    ctx.font='14px monospace'; ctx.fillStyle=rgb(0.75,0.85,0.95);
    t='You defeated the Sun Titan and saved Sector 7!';
    ctx.fillText(t, WIN_W/2-ctx.measureText(t).width/2, WIN_H/2+20);
    ctx.font='20px monospace'; ctx.fillStyle=rgb(0.95,0.75,0.10);
    t='FINAL SCRAP: '+score; ctx.fillText(t, WIN_W/2-ctx.measureText(t).width/2, WIN_H/2-15);
    ctx.fillStyle=rgb(0.45,0.85,0.45);
    t='PRESS ENTER TO PLAY AGAIN'; ctx.fillText(t, WIN_W/2-ctx.measureText(t).width/2, WIN_H/2-65);
  } else if (gameState === STATE.GAME_OVER) {
    ctx.fillStyle = '#000'; ctx.fillRect(0,0,WIN_W,WIN_H);
    ctx.font='32px monospace'; ctx.fillStyle=rgb(0.75,0.08,0.08);
    let t='COLONY LOST'; ctx.fillText(t, WIN_W/2-ctx.measureText(t).width/2, WIN_H/2+60);
    ctx.font='14px monospace'; ctx.fillStyle=rgb(0.65,0.65,0.70);
    t='The invasion overwhelmed Sector 7.';
    ctx.fillText(t, WIN_W/2-ctx.measureText(t).width/2, WIN_H/2+20);
    ctx.font='20px monospace'; ctx.fillStyle=rgb(0.95,0.75,0.10);
    t='SCRAP COLLECTED: '+score; ctx.fillText(t, WIN_W/2-ctx.measureText(t).width/2, WIN_H/2-15);
    ctx.fillStyle=rgb(0.45,0.85,0.45);
    t='PRESS ENTER TO TRY AGAIN'; ctx.fillText(t, WIN_W/2-ctx.measureText(t).width/2, WIN_H/2-65);
  }
}

function rgba2str(r,g,b,a=1) { return `rgba(${Math.round(r*255)},${Math.round(g*255)},${Math.round(b*255)},${a})`; }

// Patch: fix the "−" unicode issue in arrow function
Math.Ctx_fillRect_safe = true;

initGame();
requestAnimationFrame(update);
</script>
